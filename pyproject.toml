[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dailypain"
version = "1.0.0"
description = "B2B pain point collector and dashboard"
requires-python = ">=3.14"
dependencies = [
    "openai>=1.0.0",
]

[tool.setuptools.packages.find]
include = ["collector*"]
