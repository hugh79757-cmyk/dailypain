name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint Python with ruff
        run: ruff check

      - name: Run Python tests
        run: python -m pytest --cov --cov-fail-under=70

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Check Worker syntax
        run: node -c workers/worker.js

      - name: Lint JavaScript with eslint
        run: npx eslint workers/worker.js

      - name: Run Worker tests
        run: npx vitest run
